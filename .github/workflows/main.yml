name: Build YouLite+ IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted YouTube IPA file"
        required: true
        type: string
      app_name:
        description: "App Name"
        required: true
        default: "YouTube"
        type: string
      bundle_id:
        description: "Bundle ID"
        required: true
        default: "com.google.ios.youtube"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-tweak:
    name: Build YouLite+ tweak
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install make ldid dpkg

      - name: Configure GNU make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-9bc73406cf80b711ef4d02c15ff1dedc4478a275

      - name: Set up Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk ../theos/sdks/

      - name: Build package
        run: |
          make clean package DEBUG=0 FINALPACKAGE=1
          deb=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$deb"
          cp "$deb" "$GITHUB_WORKSPACE/YouLitePlus.deb"
          dpkg-deb --info "$GITHUB_WORKSPACE/YouLitePlus.deb"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload tweak artifact
        uses: actions/upload-artifact@v4
        with:
          name: youlite-tweak
          path: YouLitePlus.deb
          if-no-files-found: error
          retention-days: 1

  package-ipa:
    name: Package YouLite+ IPA
    runs-on: macos-latest
    needs: build-tweak
    steps:
      - name: Download tweak artifact
        uses: actions/download-artifact@v4
        with:
          name: youlite-tweak
          path: .

      - name: Download and validate decrypted IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl --fail --location --retry 3 --silent --show-error "$IPA_URL" -o youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/zip" && "$file_type" != "application/x-ios-app" ]]; then
            echo "::error::The downloaded file is not a valid IPA. Detected: $file_type"
            exit 1
          fi
          unzip -tq youtube.ipa

      - name: Install IPA packaging tool
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject YouLite+
        env:
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          cyan -i youtube.ipa \
            -o "YouLitePlus_${GITHUB_RUN_NUMBER}.ipa" \
            -uwef YouLitePlus.deb \
            -n "$APP_NAME" \
            -b "$BUNDLE_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouLitePlus-IPA
          path: YouLitePlus_${{ github.run_number }}.ipa
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: youlite-${{ github.run_number }}
          name: YouLite+ build ${{ github.run_number }}
          draft: true
          files: YouLitePlus_${{ github.run_number }}.ipa
